plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = '5ifthNN'
}

repositories {
	mavenCentral()
}

configurations {
	onnxBundle
}

loom {
	mods {
		"fifthnn" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Phase 2 ONNX Runtime: compile-only in main ~150KB JAR, packaged separately in 5ifthNN-OnnxRuntime-<ver>.jar
	// Install 5ifthNN-OnnxRuntime once in mods/ only when running Phase 2 ONNX inference!
	implementation "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
	onnxBundle "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

def onnxMetaDir = layout.buildDirectory.dir("generated/onnx-companion")
def ortVersion = project.onnxruntime_version.toString()

tasks.register("generateOnnxCompanionMeta") {
	inputs.property("ortVer", ortVersion)
	outputs.dir(onnxMetaDir)
	doLast {
		def dir = onnxMetaDir.get().asFile
		dir.mkdirs()
		new File(dir, "fabric.mod.json").text = """{
  "schemaVersion": 1,
  "id": "fifthnn-onnxruntime",
  "version": "${ortVersion}",
  "name": "5ifthNN ONNX Runtime Companion",
  "description": "One-time ONNX Runtime library mod for 5ifthNN Phase 2 inference. Only needed when running trained .onnx models.",
  "authors": ["5ivesaw"],
  "license": "MIT",
  "environment": "client",
  "jars": [
    { "file": "META-INF/jars/onnxruntime-${ortVersion}.jar" }
  ]
}
"""
	}
}

tasks.register("buildOnnxRuntimeAddon", Jar) {
	dependsOn(tasks.named("generateOnnxCompanionMeta"))
	archiveBaseName.set("5ifthNN-OnnxRuntime")
	archiveVersion.set(ortVersion)
	destinationDirectory.set(layout.buildDirectory.dir("onnx-addon"))
	from(onnxMetaDir)
	from(configurations.onnxBundle) {
		into("META-INF/jars")
		rename { "onnxruntime-${ortVersion}.jar" }
	}
}

tasks.named("assemble").configure {
	dependsOn(tasks.named("buildOnnxRuntimeAddon"))
}
